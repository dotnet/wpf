name: Refresh private WPF shortlist
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Apply board changes when the board publication control is enabled
        type: boolean
        default: false
permissions: {}
concurrency:
  group: wpf-triage-publication
  cancel-in-progress: false
jobs:
  project:
    if: github.repository == 'dotnet/wpf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refresh without exposing private project data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WPF_TRIAGE_PROJECT_TOKEN: ${{ secrets.WPF_TRIAGE_PROJECT_TOKEN }}
          WPF_TRIAGE_PROJECT_NUMBER: ${{ secrets.WPF_TRIAGE_PROJECT_NUMBER }}
          WPF_TRIAGE_APPROVAL_RUN: ${{ vars.WPF_TRIAGE_APPROVAL_RUN || '0' }}
          PUBLISH: ${{ inputs.publish && vars.WPF_TRIAGE_BOARD_ENABLED == 'true' || false }}
        run: python .github/scripts/issue-triage/project.py --publish "$PUBLISH"
