name: WPF issue triage tests
on:
  pull_request:
    paths: ['.github/scripts/issue-triage/**', '.github/workflows/issue-triage*', '.github/aw/**']
  push:
    branches: [main]
    paths: ['.github/scripts/issue-triage/**', '.github/workflows/issue-triage*', '.github/aw/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/scripts/issue-triage/tests -v
