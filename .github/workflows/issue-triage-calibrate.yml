name: Approve WPF priority calibration
on:
  workflow_dispatch:
    inputs:
      backlog_run:
        description: Complete backlog run whose P0/P1 evidence has been reviewed
        required: true
        type: number
permissions: {}
jobs:
  approve:
    if: github.repository == 'dotnet/wpf' && github.ref == 'refs/heads/main'
    environment: wpf-triage-priority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify reviewed coverage and projected counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKLOG_RUN: ${{ inputs.backlog_run }}
        run: >-
          python .github/scripts/issue-triage/backlog.py "$RUNNER_TEMP/approval.json"
          --resume-run "$BACKLOG_RUN" --approve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wpf-approval-${{ github.run_id }}
          path: ${{ runner.temp }}/approval.json
          retention-days: 90
          if-no-files-found: error
