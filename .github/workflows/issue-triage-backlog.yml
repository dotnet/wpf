name: WPF backlog assessment
on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: Trusted earlier backlog run, or 0 for a new inventory
        type: number
        default: 0
      batch_size:
        description: Issues to assess, 0 for inventory only, maximum 10
        type: number
        default: 0
      credit_budget:
        description: Explicit cumulative credit budget, including earlier reserved batches
        type: number
        default: 0
      retry_errors:
        description: Retry errors only after inspecting prior request IDs and reserving more credits
        type: boolean
        default: false
permissions: {}
concurrency:
  group: wpf-backlog-assessment
  cancel-in-progress: false
jobs:
  assess:
    if: github.repository == 'dotnet/wpf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inventory and assess a bounded batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          CREDIT_BUDGET: ${{ inputs.credit_budget }}
          RETRY_ERRORS: ${{ inputs.retry_errors }}
        run: >-
          python .github/scripts/issue-triage/backlog.py "$RUNNER_TEMP/manifest.json"
          --resume-run "$RESUME_RUN" --batch-size "$BATCH_SIZE" --credit-budget "$CREDIT_BUDGET"
          --retry-errors "$RETRY_ERRORS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wpf-backlog-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest.json
          retention-days: 90
          if-no-files-found: error
